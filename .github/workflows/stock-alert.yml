name: Stock Alert Bot

on:
  repository_dispatch:
    types: [manual-trigger]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests beautifulsoup4

      - name: Run script
        run: |
          # 폴더가 아닌 '파일(-type f)' 중에서만 검색하도록 수정했습니다.
          SCRIPT_FILE=$(find . -type f -name "stock_alert.py" | head -n 1)
          echo "Found script at: $SCRIPT_FILE"
          python "$SCRIPT_FILE"
