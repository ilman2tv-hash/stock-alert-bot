name: Stock Alert Bot

on:
  workflow_dispatch:

jobs:
  run-stock-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set market mode
        run: |
          HOUR=$(date -u +"%H")

          if [ "$HOUR" = "07" ]; then
            echo "MARKET_MODE=KR" >> $GITHUB_ENV
          elif [ "$HOUR" = "21" ]; then
            echo "MARKET_MODE=US" >> $GITHUB_ENV
          elif [ "$HOUR" = "00" ]; then
            echo "MARKET_MODE=CRYPTO" >> $GITHUB_ENV
          else
            echo "MARKET_MODE=ALL" >> $GITHUB_ENV
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install yfinance pandas requests numpy pykrx lxml feedparser googletrans==4.0.0rc1

      - name: Run stock alert bot
        run: |
          python stock_alert_bot.py
