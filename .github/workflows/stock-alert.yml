name: Stock Alert Bot

on:
  repository_dispatch:
    types: [manual-trigger]
  workflow_dispatch:
    inputs:
      market:
        description: 'Market mode'
        required: false
        default: 'KR'
        type: choice
        options:
          - KR
          - US
          - ALL

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine MARKET_MODE
        run: |
          echo "MARKET_MODE=${{ github.event.client_payload.market || github.event.inputs.market || 'KR' }}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests beautifulsoup4 feedparser googletrans==4.0.0-rc1 pykrx lxml html5lib

      - name: Check env
        run: |
          echo "MARKET_MODE=$MARKET_MODE"
          if [ -z "$WEBHOOK_URL" ]; then
            echo "WEBHOOK_URL 없음"
            exit 1
          else
            echo "WEBHOOK_URL 있음"
          fi

      - name: Run script
        run: python stock_alert_bot.py
