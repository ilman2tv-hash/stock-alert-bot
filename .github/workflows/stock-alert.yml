name: Stock Alert Bot

on:
  repository_dispatch:
    types: [manual-trigger]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests beautifulsoup4

      - name: Run script
        # find 명령어를 써서 파일 위치를 자동으로 찾아 실행하게 만들었습니다.
        run: |
          SCRIPT_PATH=$(find . -name "stock_alert.py" | head -n 1)
          python "$SCRIPT_PATH"
