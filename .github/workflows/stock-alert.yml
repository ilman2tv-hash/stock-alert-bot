name: Stock Alert Bot

on:
  repository_dispatch:
    types: [manual-trigger]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      MARKET_MODE: ${{ github.event.client_payload.market || 'ALL' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests beautifulsoup4 feedparser googletrans==4.0.0-rc1 pykrx lxml html5lib

      - name: Run script
        run: python stock_alert_bot.py
