name: Stock Alert Bot

on:
  repository_dispatch:
    types: [manual-trigger]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 필요한 라이브러리들을 직접 설치하거나, 폴더 안의 requirements.txt를 사용합니다.
          pip install yfinance pandas requests beautifulsoup4
          # 만약 TA-Lib 등을 사용하신다면 추가 설치가 필요할 수 있습니다.

      - name: Run script
        run: python stock-alert-bot/stock_alert.py  # 폴더 경로를 정확히 지정했습니다.
