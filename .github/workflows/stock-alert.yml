name: Stock Alert Bot

on:
  repository_dispatch:
    types: [manual-trigger]  # cron-job.org에서 보낼 이벤트 타입
  workflow_dispatch:          # 수동 실행용

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests feedparser googletrans==4.0.0-rc1 pykrx lxml

      - name: Run Alert Script
        env:
          # cron-job.org에서 보낸 payload의 market 값을 MARKET_MODE로 설정
          MARKET_MODE: ${{ github.event.client_payload.market || 'ALL' }}
          # 디스코드 웹훅 주소를 여기에 직접 넣거나 GitHub Secrets에 등록하세요
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }} 
        run: python stock_alert.py
