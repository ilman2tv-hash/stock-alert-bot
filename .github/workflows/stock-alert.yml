name: Stock Alert Bot

on:
  repository_dispatch:
    types: [manual-trigger]
  workflow_dispatch:
    inputs:
      market:
        description: 'Market mode'
        required: true
        default: 'KR'
        type: choice
        options:
          - KR
          - US
          - US_OPTION
          - ALL
  schedule:
    # 한국시간(KST) 새벽 2시 (UTC 전날 17시)
    - cron: '0 17 * * *'
    # 한국시간(KST) 아침 9시 (UTC 0시)
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 기존의 job 단위 env 할당 대신, 스텝에서 이벤트를 구분해 동적으로 환경변수 설정
      - name: Determine MARKET_MODE
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            # 스케줄러(새벽 2시, 아침 9시)로 실행된 경우 US_OPTION 강제 할당
            echo "MARKET_MODE=US_OPTION" >> $GITHUB_ENV
          else
            # 수동(workflow_dispatch)이나 외부(repository_dispatch) 실행인 경우 입력값 우선
            echo "MARKET_MODE=${{ github.event.client_payload.market || github.event.inputs.market || 'KR' }}" >> $GITHUB_ENV
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests beautifulsoup4 feedparser googletrans==4.0.0-rc1 pykrx lxml html5lib

      - name: Check env
        run: |
          echo "MARKET_MODE=$MARKET_MODE"
          if [ -z "$WEBHOOK_URL" ]; then
            echo "WEBHOOK_URL 없음"
            exit 1
          else
            echo "WEBHOOK_URL 있음"
          fi

      - name: Run script
        run: python stock_alert_bot.py
